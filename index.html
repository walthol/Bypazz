<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bypazz</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap" rel="stylesheet" />
    <script src="https://js.pusher.com/8.0/pusher.min.js"></script>
    <style>
      html, body {
        margin: 0; padding: 0; height: 100%; overflow: hidden;
        font-family: 'Roboto Mono', monospace;
        background: linear-gradient(0deg, #1a1a1a, #000);
        animation: backgroundFade 2s infinite alternate; 
      }
      @keyframes backgroundFade {
        0% { background: #1a1a1a; }
        50% { background: #0d0d0d; }
        100% { background: #000; }
      }
      .splash {
        position: fixed; top:0; left:0; width:100vw; height:100vh;
        background-color: rgba(0,0,0,0.85); color: white; display: flex;
        flex-direction: column; justify-content: center; align-items: center;
        z-index: 999; cursor: pointer; transition: all 1s ease;
      }
      .splash.fade { transform: scale(1.5); opacity: 0; }
      .splash h1 { font-size: 64px; font-weight: bold; margin:0; }
      .splash p { font-size: 24px; margin-top: 20px; opacity: 0; transition: opacity 1s ease; }
      .splash.showHint p { opacity: 1; }
      .game-button {
        background-color: black; color: white; border: 1px solid red;
        font-size: 26px; width: 100%; cursor: pointer; border-radius: 10px;
        margin: 10px 0; max-width: 600px; display: block;
      }
      center { margin-top: 50px; }

      /* ADMIN & BANNER STYLES */
      #globalBanner {
        position: fixed; top: 0; left: 0; width: 100%;
        background-color: #ff0000; color: white; text-align: center;
        padding: 15px; font-weight: bold; font-size: 20px; z-index: 99999;
        display: none; box-shadow: 0 4px 6px rgba(0,0,0,0.5);
      }
      #adminLockBtn {
        position: fixed; bottom: 15px; right: 15px;
        width: 40px; height: 40px; border-radius: 50%;
        background-color: rgba(255,255,255,0.1); border: none;
        font-size: 20px; cursor: pointer; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        opacity: 0.3; transition: opacity 0.2s;
      }
      #adminLockBtn:hover { opacity: 1; }
      #adminToggleBtn {
        position: fixed; bottom: 15px; right: 15px; padding: 10px 20px;
        background-color: #000; color: #fff; border: 1px solid red;
        border-radius: 8px; cursor: pointer; z-index: 9999; display: none;
        font-family: 'Roboto Mono', monospace;
      }
      #adminOverlay {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        background-color: rgba(0,0,0,0.9); z-index: 99999;
        display: none; justify-content: center; align-items: center;
      }
      .admin-modal {
        background-color: #111; border: 1px solid red; border-radius: 12px;
        padding: 30px; width: 90%; max-width: 400px; text-align: center; color: white;
      }
      .admin-modal input {
        width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 6px;
        border: none; box-sizing: border-box; font-family: 'Roboto Mono', monospace;
      }
      .admin-modal button {
        width: 100%; padding: 12px; cursor: pointer; background-color: red;
        color: white; border: none; border-radius: 6px; font-weight: bold;
        margin-bottom: 10px; font-family: 'Roboto Mono', monospace; font-size: 16px;
      }
      .admin-modal .cancel-btn { background-color: transparent; border: 1px solid #555; color: #aaa; }
    </style>
  </head>
  <body>
    <div id="globalBanner"></div>

    <div class="splash" id="splashScreen">
      <h1>Bypazz</h1>
      <p id="splashHint">Click Your Screen To Continue</p>
    </div>

    <center>
      <button id="onlineChatroomsButton" class="game-button">Online Chat</button>
      <button id="windowsEmulatorButton" class="game-button">Windows Emulator</button>
      <button id="vex6Button" class="game-button">Vex 6</button>
      <button id="slowRoadsButton" class="game-button">Slow.Roads</button>
      <button id="clusterTrucksButton" class="game-button">Cluster Trucks</button>
      <button id="motoX3MButton" class="game-button">Moto.X3M</button>
      <button id="snowRider3DButton" class="game-button">Snow Rider 3D</button>
      <button id="happyWheelsButton" class="game-button">Happy Wheels</button>
      <button id="theBackroomsButton" class="game-button">Backrooms Game</button>
      <button id="cookieClickerButton" class="game-button">Cookie Clicker</button>
      <button id="driftHuntersButton" class="game-button">Drift Hunters</button>
      <button id="clickSpeedTest" class="game-button">Click Speed Test</button>
      <button id="clickSpeedTest" class="game-button">Super Mario Bros</button>
    </center>

    <button id="adminLockBtn" title="Admin Area">🔒</button>
    <button id="adminToggleBtn">⚙️ Open Panel</button>

    <div id="adminOverlay">
      <div class="admin-modal">
        <div id="adminPromptDiv">
          <h2>Admin Access</h2>
          <input type="password" id="adminPasswordInput" placeholder="Enter Password..." />
          <button id="verifyBtn">Verify</button>
          <button class="cancel-btn" id="cancelPromptBtn">Cancel</button>
        </div>
        <div id="adminPanelDiv" style="display: none;">
          <h2>Broadcast Message</h2>
          <input type="text" id="adminMessageInput" placeholder="Type global message..." />
          <button id="sendBroadcastBtn">Send to Everyone</button>
          <button class="cancel-btn" id="closePanelBtn">Hide Panel</button>
          <p id="adminStatus" style="color: #aaa; margin-top: 10px;"></p>
        </div>
      </div>
    </div>

    <script>
        // --- GAME LOGIC ---
        const splash = document.getElementById('splashScreen');
        setTimeout(() => splash.classList.add('showHint'), 1000);
        splash.addEventListener('click', () => {
          splash.classList.add('fade');
          setTimeout(() => splash.style.display = 'none', 1000);
        });

        const urls = {
          vex6: "https://script.google.com/macros/s/AKfycbzi5I00V5E4UoWKNwYMpazWyXDs1J4m0hui0937lFzMRKs31QGZ3rcUHRroAt13wmc9tw/exec",
          slowRoads: "https://script.google.com/macros/s/AKfycbzqDA2SnuVZ3DRelxxbUxSV9Z1RJz_gQfDRx06WUpgppWgrdDEErtZ1Lev9O6j2w9ioBQ/exec",
          clusterTrucks: "https://script.google.com/macros/s/AKfycbw6e8fflbfydV7kom5id09nKaM6ix0hLlXHbs3XHOnxzrndUgPtHUHENrwKomI2Hpk3/exec",
          motoX3M: "https://script.google.com/macros/s/AKfycbw7_zG02ZMXnPSdwCx0CcmN8eX_0Bk3715TSP-Eglb1DyVhp7RxShuXq4qJ8Q2s7cnW/exec",
          snowRider3D: "https://script.google.com/macros/s/AKfycbw5Z-Ryg_JfIIDYH7pzzPKXlr2tN0HCw-tT_ZvxBGDPsDDY41ewPVneVeLzelfpnBab/exec",
          happyWheels: "https://script.google.com/macros/s/AKfycbyfMPVIGx6dJPrYKeE9e4Erj949-dH28pWVRjdV1vgnoylpBV8af03JNLoz2MwAIBLECg/exec",
          theBackrooms: "https://storage.googleapis.com/test-41376.appspot.com/broom.html",
          cookieClicker: "https://script.google.com/macros/s/AKfycbxGM35J29NkO-2LYjxWj_cA9IUaaXypkUy-LqXyLRbGTz0R6lXmAEapz1STN1jlTIRavw/exec",
          driftHunters: "https://script.google.com/macros/s/AKfycbw8iHPqdVFEzquUYbNxFVAu1Tw4Nri5SWMRLdP_c7a84vCOHVG7YUWuhjSVptg1SVHr/exec",
          windowsEmulator: "https://terminator.aeza.net/en/",
          onlineChatrooms: "https://nodecrypt.runnertagvr.workers.dev/",
          clickSpeedTest: "https://www.rapidtables.com/tools/click-test.html",
          superMarioBros: "https://cim.alwaysdata.net/jeu/mario/index.html"
        };

        function openGameInNewTab(url, message="") {
          const win = window.open("about:blank", "_blank");
          if (!win) return alert("Popup blocked! Allow popups for this site.");
          win.document.body.style.margin = '0'; win.document.body.style.height = '100vh'; win.document.body.style.backgroundColor = 'black';
          const iframe = win.document.createElement('iframe');
          iframe.src = url; iframe.style.border = 'none'; iframe.style.width = '100vw'; iframe.style.height = '100vh';
          win.document.body.appendChild(iframe);
          if(message) win.alert(message);
        }

        document.getElementById('vex6Button').onclick = () => openGameInNewTab(urls.vex6);
        document.getElementById('slowRoadsButton').onclick = () => openGameInNewTab(urls.slowRoads);
        document.getElementById('clusterTrucksButton').onclick = () => openGameInNewTab(urls.clusterTrucks);
        document.getElementById('motoX3MButton').onclick = () => openGameInNewTab(urls.motoX3M);
        document.getElementById('snowRider3DButton').onclick = () => openGameInNewTab(urls.snowRider3D);
        document.getElementById('happyWheelsButton').onclick = () => openGameInNewTab(urls.happyWheels);
        document.getElementById('theBackroomsButton').onclick = () => openGameInNewTab(urls.theBackrooms);
        document.getElementById('cookieClickerButton').onclick = () => openGameInNewTab(urls.cookieClicker);
        document.getElementById('driftHuntersButton').onclick = () => openGameInNewTab(urls.driftHunters);
        document.getElementById('windowsEmulatorButton').onclick = () => openGameInNewTab(urls.windowsEmulator);
        document.getElementById('onlineChatroomsButton').onclick = () => openGameInNewTab(urls.onlineChatrooms, "JOIN THE BYPAZZ CHAT ROOM! \n\nChannel Name: BYPAZZ \nPassword: bypazz");
        document.getElementById('clickSpeedTest').onclick = () => window.open(urls.clickSpeedTest, '_blank');
        document.getElementById('superMarioBros').onclick = () => openGameInNewTab(urls.superMarioBros, "Credits To https://cim.alwaysdata.net/jeu/");


        // --- PUSHER: RECEIVE LIVE MESSAGES ---
        // REPLACE THESE TWO STRINGS WITH YOUR ACTUAL KEYS!
        const pusher = new Pusher('c4d7ec2739da31e5d600', {
          cluster: 'us2'
        });

        const channel = pusher.subscribe('global-channel');
        channel.bind('new-message', function(data) {
          const banner = document.getElementById('globalBanner');
          banner.innerText = data.text;
          banner.style.display = 'block';
          setTimeout(() => { banner.style.display = 'none'; banner.innerText = ''; }, 5000);
        });

        // --- ADMIN UI LOGIC ---
        // Change this password to whatever you want!
        const ADMIN_PASSWORD = "16502690"; 

        const adminLockBtn = document.getElementById('adminLockBtn');
        const adminToggleBtn = document.getElementById('adminToggleBtn');
        const adminOverlay = document.getElementById('adminOverlay');
        const adminPromptDiv = document.getElementById('adminPromptDiv');
        const adminPanelDiv = document.getElementById('adminPanelDiv');
        
        const adminPasswordInput = document.getElementById('adminPasswordInput');
        const verifyBtn = document.getElementById('verifyBtn');
        const cancelPromptBtn = document.getElementById('cancelPromptBtn');
        
        const adminMessageInput = document.getElementById('adminMessageInput');
        const sendBroadcastBtn = document.getElementById('sendBroadcastBtn');
        const closePanelBtn = document.getElementById('closePanelBtn');
        const adminStatus = document.getElementById('adminStatus');

        adminLockBtn.onclick = () => {
          adminOverlay.style.display = 'flex'; adminPromptDiv.style.display = 'block';
          adminPanelDiv.style.display = 'none'; adminPasswordInput.value = ''; adminPasswordInput.focus();
        };

        cancelPromptBtn.onclick = () => adminOverlay.style.display = 'none';

        verifyBtn.onclick = () => {
          if (adminPasswordInput.value === ADMIN_PASSWORD) {
            adminLockBtn.style.display = 'none'; adminPromptDiv.style.display = 'none';
            adminPanelDiv.style.display = 'block'; adminMessageInput.focus();
          } else {
            window.location.reload(); 
          }
        };

        adminPasswordInput.addEventListener("keypress", (e) => e.key === "Enter" && verifyBtn.click());

        closePanelBtn.onclick = () => {
          adminOverlay.style.display = 'none'; adminToggleBtn.style.display = 'block';
        };

        adminToggleBtn.onclick = () => {
          adminOverlay.style.display = 'flex'; adminPanelDiv.style.display = 'block';
          adminPromptDiv.style.display = 'none'; adminMessageInput.focus();
        };

        sendBroadcastBtn.onclick = async () => {
          const text = adminMessageInput.value;
          if (!text) return;
          adminStatus.innerText = "Sending..."; adminStatus.style.color = "#aaa";

          try {
            // This triggers the file below!
            const res = await fetch('/api/send-message', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ text: text, secretPassword: adminPasswordInput.value })
            });

            if (res.ok) {
              adminStatus.innerText = "✅ Broadcast sent!"; adminStatus.style.color = "lightgreen";
              adminMessageInput.value = '';
              setTimeout(() => { closePanelBtn.click(); adminStatus.innerText = ""; }, 2000);
            } else {
              adminStatus.innerText = "❌ Failed. Check Vercel logs."; adminStatus.style.color = "red";
            }
          } catch (err) {
            adminStatus.innerText = "❌ Network error."; adminStatus.style.color = "red";
          }
        };
        adminMessageInput.addEventListener("keypress", (e) => e.key === "Enter" && sendBroadcastBtn.click());
    </script>
  </body>
</html>
